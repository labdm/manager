name: Setup pnpm
description: Install the repo's pnpm version and Node 26, then a frozen install with the pnpm cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.21.0
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
