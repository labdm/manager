name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      # Non-blocking while existing advisories are being worked off.
      # Do not require this check. The step is allowed to fail.
      - name: Scan dependencies (high+)
        continue-on-error: true
        run: |
          set +e
          pnpm run deps:scan > "$RUNNER_TEMP/audit.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### pnpm audit"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
