name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# These jobs always run. Do not add path filters or `if` conditions: a
# skipped job that is a required status check blocks the pull request.
# Check names are the job `name` values. See docs/ci.md.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: bash scripts/check-convex-node-bundle.sh
      - run: pnpm build
      - run: pnpm verify:api
      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  # Aggregator for the ruleset that still requires `check`. It reports
  # failure, not skipped, when one of the jobs above fails.
  check:
    name: check
    needs: [lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, typecheck, test, and build
        run: |
          fail=0
          check() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished as $2"
              fail=1
            fi
          }
          check lint "${{ needs.lint.result }}"
          check typecheck "${{ needs.typecheck.result }}"
          check test "${{ needs.test.result }}"
          check build "${{ needs.build.result }}"
          exit "$fail"
