<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed in to Manager</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3efe4;
        color: #1f1e1b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(30rem, calc(100% - 2rem));
        padding: 2.5rem;
        border: 1px solid #d9d2c2;
        border-radius: 1rem;
        background: #fffdf7;
        box-shadow: 0 1.25rem 3rem rgb(54 46 29 / 10%);
        text-align: center;
      }
      .mark {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a6d3b;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.6rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.6;
      }
      .status {
        color: #5f5b52;
      }
      .hint {
        font-size: 0.875rem;
        color: #7a7468;
      }
      .fallback {
        display: none;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .fallback a {
        color: #8a6d3b;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Manager</p>
      <h1>Signed in</h1>
      <p class="status" id="status">Finishing sign-in…</p>
      <p class="hint">You can close this tab. Manager comes to the front.</p>
      <p class="fallback" id="fallback">
        Manager did not open? <a id="retry" href="#">Open Manager</a>.
      </p>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var fallback = document.getElementById("fallback");
        var retry = document.getElementById("retry");
        var clerkParams = window.location.search + window.location.hash;
        var callbackUrl = "dev.labdm.manager://callback" + clerkParams;

        retry.href = callbackUrl;

        if (!clerkParams) {
          status.textContent =
            "This page completes sign-in for the Manager desktop app. You can close it.";
          return;
        }

        status.textContent = "Opening Manager…";
        window.setTimeout(function () {
          fallback.style.display = "block";
        }, 1500);
        try {
          // Hand Clerk's callback parameters to the registered desktop deep link.
          // The browser keeps showing this page instead of hanging on a custom scheme.
          window.location.href = callbackUrl;
        } catch (_) {
          status.textContent = "Return to Manager to finish signing in.";
        }
      })();
    </script>
  </body>
</html>
