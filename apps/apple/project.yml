name: Manager
options:
  bundleIdPrefix: dev.labdm
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  # Keep the generated project deterministic across machines.
  groupSortPosition: top

packages:
  ManagerKit:
    path: Packages/ManagerKit
  ManagerData:
    path: Packages/ManagerData
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    from: "1.7.0"
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: "0.8.2"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO
    # ConvexMobile's prebuilt Rust library ships arm64 only, so an x86_64
    # simulator build cannot link. Apple Silicon Macs are the supported
    # development and CI platform.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  Manager:
    type: application
    # One app target, three destinations: iPhone (including the foldable Duo),
    # iPad and Mac. watchOS, tvOS, visionOS and CarPlay need separate targets or
    # entitlements and are intentionally out of scope.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Manager
        excludes:
          - Info.plist
      - path: Config/Secrets.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.labdm.manager
        PRODUCT_NAME: Manager
        INFOPLIST_FILE: Manager/Info.plist
        CODE_SIGN_ENTITLEMENTS: Manager/Manager.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Signing is per-developer: set DEVELOPMENT_TEAM in Xcode or pass it on
        # the command line. CI builds with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ManagerKit
        product: ManagerCore
      - package: ManagerKit
        product: ManagerUI
      - package: ManagerData
        product: ManagerData
      - package: ClerkKit
        product: ClerkKit
      - package: ClerkKit
        product: ClerkKitUI
      - package: ConvexMobile
        product: ConvexMobile

schemes:
  Manager:
    build:
      targets:
        Manager: all
    run:
      config: Debug
    archive:
      config: Release
