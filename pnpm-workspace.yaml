packages:
  - apps/*
  - packages/*

allowBuilds:
  '@clerk/shared': true
  browser-tabs-lock: true
  core-js: true
  esbuild: true
  sharp: false

# typescript-eslint still needs the TS 6 API; tsc itself runs TypeScript 7
# through the @typescript/native alias. This peer range is for a future TS 7
# programmatic API and is not used by lint.
peerDependencyRules:
  allowedVersions:
    "@typescript/native": "7.0.2"

overrides:
  # tauri-plugin-clerk and @clerk/react must share one @clerk/shared type graph.
  '@clerk/shared': 4.48.1

minimumReleaseAgeExclude:
  - '@clerk/backend@3.31.0 || 3.31.1'
  - '@clerk/shared@4.47.0 || 4.48.0'
  - convex@1.51.0
  - '@clerk/react@6.19.1'
